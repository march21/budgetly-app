[package]
name = "budgetly-desktop"
version = "0.8.0"
description = "Coque desktop de Budgetly : lance le cœur en local et affiche l'interface"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
getrandom = "0.2"
serde_json = "1"
