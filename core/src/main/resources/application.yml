server:
  # Mode desktop : jamais d'écoute hors de la machine.
  address: 127.0.0.1
  port: ${BUDGETLY_PORT:47811}

spring:
  application:
    name: budgetly-core
  main:
    banner-mode: off
  servlet:
    multipart:
      max-file-size: 512MB
      # Relevés et exports restent en mémoire (jamais dans le dossier temporaire de Tomcat) ; seules les
      # sauvegardes, chiffrées, peuvent dépasser ce seuil.
      file-size-threshold: 64MB
      max-request-size: 520MB

budgetly:
  data-dir: ${BUDGETLY_DATA_DIR:${user.home}/.budgetly}
  launch-token: ${BUDGETLY_LAUNCH_TOKEN:}
